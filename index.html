<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legado que Ensina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "DM Sans", sans-serif;
    background: #faf8f4;
    color: #0e2034;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px;
}

.wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    max-width: 1100px;
    width: 100%;
    align-items: center;
}

.col {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 40px 50px;
    gap: 22px;
    min-height: 420px;
    justify-content: center;
}

.col:first-child {
    border-right: 1px solid rgba(14,32,52,.1);
}

.logo {
    display: block;
    height: auto;
    max-width: 260px;
    width: 100%;
}

.label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .38em;
    text-transform: uppercase;
    color: #2d7a6b;
}

.title {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(36px, 4vw, 52px);
    font-weight: 400;
    line-height: 1.05;
    letter-spacing: -.01em;
    color: #0e2034;
}

.title em {
    font-style: italic;
    color: #2d7a6b;
}

.text {
    font-size: 13px;
    font-weight: 300;
    line-height: 1.85;
    color: #5c6a76;
    max-width: 340px;
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 8px;
    padding: 15px 32px;
    background: #2d7a6b;
    color: white;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background .3s ease;
}

.btn:hover {
    background: #0e2034;
}

@media (max-width: 780px) {
    body { padding: 40px 24px; }
    .wrap {
        grid-template-columns: 1fr;
        gap: 0;
    }
    .col {
        padding: 60px 20px;
        min-height: auto;
        border-right: none !important;
    }
    .col:first-child {
        border-bottom: 1px solid rgba(14,32,52,.1);
    }
    .logo { max-width: 220px; }
}
</style>
</head>
<body>

<div class="wrap">

    <!-- LADO ESQUERDO — PSICOPEDAGOGIA -->
    <div class="col">

        <img
            class="logo"
            src="https://i.imgur.com/ZhoF1qy.png"
            alt="Legado que Ensina"
        >

        <span class="label">Psicopedagogia</span>

        <h1 class="title">Em <em>breve.</em></h1>

        <p class="text">
            Estamos preparando um novo espaço digital para
            acolher famílias, crianças e adolescentes.
        </p>

    </div>

    <!-- LADO DIREITO — SISTEMA -->
    <div class="col">

        <img
            class="logo"
            src="https://i.imgur.com/wpdRGvm.png"
            alt="Sistema Legado que Ensina"
        >

        <span class="label">Para psicopedagogos</span>

        <h2 class="title">Sistema para <em>psicopedagogos.</em></h2>

        <p class="text">
            Plataforma digital para organizar atendimentos
            e acompanhar evoluções clínicas.
        </p>

        <a
            href="https://sistema.legadoqueensina.com.br"
            class="btn"
            target="_blank"
            rel="noopener noreferrer"
        >
            <i class="fas fa-arrow-right"></i>
            Acessar Sistema
        </a>

    </div>

</div>

</body>
</html>
