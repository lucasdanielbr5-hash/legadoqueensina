<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em breve | Legado que Ensina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    height: 100%;
}

body {
    background: #f7f5ef;
    color: #0e2034;
    font-family: "DM Sans", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    position: relative;
    overflow: hidden;
}

/* Fundo com pontinhos sutis */
body::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .35;
    background-image: radial-gradient(rgba(14,32,52,.08) .6px, transparent .6px);
    background-size: 8px 8px;
    pointer-events: none;
}

/* Círculo decorativo atrás da logo */
.circle-bg {
    position: absolute;
    width: min(520px, 90vw);
    height: min(520px, 90vw);
    border-radius: 50%;
    background: #ebe9e0;
    z-index: 1;
}

.circle-bg::after {
    content: "";
    position: absolute;
    inset: 35px;
    border: 1px solid rgba(45, 122, 107, .2);
    border-radius: 50%;
}

/* Conteúdo central */
.content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 38px;
}

.logo {
    width: min(320px, 70vw);
    height: auto;
    display: block;
    filter: drop-shadow(0 20px 40px rgba(14,32,52,.12));
    animation: fadeUp .9s ease both;
}

.title {
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(38px, 6vw, 64px);
    line-height: 1;
    font-weight: 400;
    letter-spacing: -.04em;
    color: #0e2034;
    animation: fadeUp .9s ease .15s both;
}

.title em {
    color: #2d7a6b;
    font-style: italic;
}

.subtitle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: #596873;
    animation: fadeUp .9s ease .3s both;
}

.divider {
    width: 60px;
    height: 1px;
    background: #2d7a6b;
    animation: fadeUp .9s ease .4s both;
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>
<body>

<div class="circle-bg"></div>

<div class="content">

    <img
        class="logo"
        src="https://i.imgur.com/wpdRGvm.png"
        alt="Legado que Ensina"
    >

    <div class="divider"></div>

    <h1 class="title">
        Em <em>breve.</em>
    </h1>

    <p class="subtitle">
        Legado que Ensina
    </p>

</div>

</body>
</html>
